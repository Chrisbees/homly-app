spring.application.name=spring-security-asymmetric-encryption
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.config.import=file:.env[.properties]
server.port=8081

spring.h2.console.path=/h2-console

app.security.jwt.access-token-expiration=900000
app.security.jwt.refresh-token-expiration=604800000

app.security.jwt.disposable-email=10minutemail,20minutemail,33mail,5ymail,anonbox,querrillamail,mailinator,maildrop,mailnesia,moakt,my10minutemail,throwawaymail,trashmail,temp-mail,tempmail,truemail,yopmail
